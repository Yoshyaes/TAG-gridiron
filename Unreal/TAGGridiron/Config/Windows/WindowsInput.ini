; Every connected gamepad (PS5 DualSense through GameInput, Xbox pads, an Azeron keypad's gamepad mode) drives the
; one human player: map all devices to the primary platform user (engine default gives each extra pad a new user).
[InputPlatformSettings_Windows InputPlatformSettings]
input.DeviceMappingPolicy=3

; GameInput reads the PS5 DualSense as a standard gamepad, but on desktop platforms the plugin defaults gamepad
; processing OFF (it assumes XInput handles pads; XInput cannot see a DualSense). Turn it on.
[GameInputPlatformSettings_Windows GameInputPlatformSettings]
bProcessGamepad=True
