[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Shipping
FullRebuild=False
bUseIoStore=True
bShareMaterialShaderCode=True
+DirectoriesToAlwaysCook=(Path="/Game/TAG")
; The one map (the stadium is built at runtime). Named, so a cook never falls back to every map it can find (the
; MetaHumanCrowdContent sample levels, MaddenRef's).
+MapsToCook=(FilePath="/Engine/Maps/Entry")
; The stadium's crowd bodies are loaded by name (Render/Stadium.cpp), so nothing references them for the cooker.
+DirectoriesToAlwaysCook=(Path="/MetaHumanCrowdContent/Characters/Assembled")
; Team logos and ability icons are read as PNG files from Content/Slate (UI/RosterUI.h, UI/TeamSelect.cpp, UI/AbilityScreen.cpp).
+DirectoriesToAlwaysStageAsUFS=(Path="Slate")
; The pack and catalog tables are JSON files read from Content (Render/Athlete.cpp PackJson, hero_catalog.json). UAT
; stages only the non-asset files of these folders (CopyBuildToStagingDirectory drops .uasset / .umap here): ~8 MB.
+DirectoriesToAlwaysStageAsUFS=(Path="TAG/AnimH/Pack")
+DirectoriesToAlwaysStageAsUFS=(Path="TAG/Anim/Pack")
+DirectoriesToAlwaysStageAsUFS=(Path="TAG/Hero")
; Private Madden 19 reference imports. Never cooked, never shipped.
+DirectoriesToNeverCook=(Path="/Game/MaddenRef")
; The UEFN-rig motion-matching databases of the old tree: only the fallback (no hero tree) loads them, nothing cooked
; references them, and their index build asserts (Tools/Art/mm_build_dbs.py). Cook and packaging only.
+DirectoriesToNeverCook=(Path="/Game/TAG/Anim/MM")

